name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.TEST_DB_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ secrets.TEST_DB_SA_PASSWORD }}' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/FieldTask.Tests/FieldTask.Tests.csproj

      - name: Build
        run: dotnet build api/FieldTask.Tests/FieldTask.Tests.csproj --no-restore --configuration Release

      - name: Test
        env:
          TEST_DB_CONNECTION: "Server=localhost,1433;User Id=sa;Password=${{ secrets.TEST_DB_SA_PASSWORD }};TrustServerCertificate=True"
        run: dotnet test api/FieldTask.Tests/FieldTask.Tests.csproj --no-build --configuration Release

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api/FieldTask.Api
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-api:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web/fieldtask-web
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-web:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Container App
        run: |
          az containerapp update \
            --name fieldtask-api \
            --resource-group fieldtask-rg \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-api:${{ github.sha }}

      - name: Update web Container App
        run: |
          az containerapp update \
            --name fieldtask-web \
            --resource-group fieldtask-rg \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/fieldtask-web:${{ github.sha }}
