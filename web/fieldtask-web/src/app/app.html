<header>
  <h1>FieldTask</h1>
  <nav>
    <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
  </nav>

  @if (auth.isLoggedIn()) {
    <div class="session">
      <span>{{ auth.username() }} ({{ auth.role() }})</span>
      <button type="button" (click)="logout()">Log out</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
